[package]
name = "sharpclicks"
version = "0.1.0"
edition = "2024"

[dependencies]

eframe = {version = "0.31.1", features = ["default"]}
enigo = "0.6.1"
spin_sleep = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5.3"

[package.metadata.packager]
product-name = "sharpclicks"
identifier = "allynated"
version = "1.0"
before-packaging-command = "cargo build --release"
formats = ["dmg", "wix", "appimage"]
icons = ["icons/*.png"]